# ====================================================================
# Nginx Configuration for 4you-stores.com
# ====================================================================
# انسخ هذا الملف إلى:
#   /etc/nginx/sites-available/4you-stores.conf
# ثم فعّله:
#   sudo ln -sf /etc/nginx/sites-available/4you-stores.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# ====================================================================

server {
    listen 80;
    server_name 4you-stores.com www.4you-stores.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name 4you-stores.com www.4you-stores.com;

    # ====== SSL (Let's Encrypt) - عدّل المسارات حسب سيرفرك ======
    ssl_certificate /etc/letsencrypt/live/4you-stores.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/4you-stores.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # ====== مسار ملفات الموقع - عدّل حسب سيرفرك ======
    root /var/www/4you-stores/dist;
    index index.html;

    # ====== Security Headers ======
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ====== SEO Files ======
    location = /robots.txt {
        try_files /robots.txt =404;
        access_log off;
    }

    location = /sitemap.xml {
        default_type application/xml;
        try_files /sitemap.xml =404;
        access_log off;
    }

    # ====== Static Assets (Long Cache) ======
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ====== API Proxy (tRPC Backend) ======
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # ====== SPA Fallback (React Router) ======
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ====== Gzip Compression ======
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ====== Max Upload Size ======
    client_max_body_size 10M;
}
